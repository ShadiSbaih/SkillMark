# Local PostgreSQL Configuration
# Run with: ./gradlew bootRun --args='--spring.profiles.active=local-postgres'

spring.datasource.url=jdbc:postgresql://localhost:5432/skillmark
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN

app.base-url=http://localhost:4200
app.certificate-verify-base-url=http://localhost:4200/verify
cors.allowed-origins=http://localhost:4200
clerk.issuer=https://loved-turtle-18.clerk.accounts.dev
clerk.jwks-url=https://loved-turtle-18.clerk.accounts.dev/.well-known/jwks.json