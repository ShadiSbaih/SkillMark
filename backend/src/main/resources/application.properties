
# ===============================
# APPLICATION
# ===============================

spring.application.name=Skillmark
spring.config.import=optional:file:.env[.properties]

# ===============================
# SERVER
# ===============================

server.port=${PORT:8080}
app.base-url=${APP_BASE_URL:}
app.certificate-verify-base-url=${APP_CERTIFICATE_VERIFY_BASE_URL:}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Rate limiting
app.rate-limit.auth.max-requests=${RATE_LIMIT_AUTH_MAX_REQUESTS:200}
app.rate-limit.invite.max-requests=${RATE_LIMIT_INVITE_MAX_REQUESTS:10}
app.rate-limit.attempt.max-requests=${RATE_LIMIT_ATTEMPT_MAX_REQUESTS:5}
app.rate-limit.public-cert.max-requests=${RATE_LIMIT_PUBLIC_CERT_MAX_REQUESTS:30}
app.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}
# Only enable when the app is behind a trusted reverse proxy that sets X-Forwarded-For.
app.rate-limit.trust-x-forwarded-for=${RATE_LIMIT_TRUST_X_FORWARDED_FOR:false}
management.endpoints.web.exposure.include=health,info


# ===============================
# DATABASE CONFIGURATION
# ===============================

spring.datasource.url=${DATABASE_URL:}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.datasource.driver-class-name=org.postgresql.Driver


# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# ===============================
# JWT AUTH CONFIG
# ===============================

jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===============================
# EMAIL CONFIG
# ===============================

app.email.from=${APP_EMAIL_FROM:noreply@skillmark.app}
sendgrid.api-key=${SENDGRID_API_KEY:}

# ===============================
# CLOUDFLARE R2 CONFIG
# ===============================

r2.account-id=${R2_ACCOUNT_ID:}
r2.access-key-id=${R2_ACCESS_KEY_ID:}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
r2.bucket-name=${R2_BUCKET_NAME:}
r2.public-base-url=${R2_PUBLIC_BASE_URL:}

# ===============================
# CLOUDINARY CONFIG
# ===============================

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ===============================
# OPENAPI / SWAGGER
# ===============================

springdoc.default-consumes-media-type=application/json
springdoc.default-produces-media-type=application/json
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.docExpansion=none
springdoc.swagger-ui.persistAuthorization=true

# ===============================
# LOGGING
# ===============================

logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN


# ===============================
# DEVTOOLS
# ===============================

spring.devtools.restart.enabled=true

# ===============================
# FLYWAY
# ===============================

spring.flyway.validate-on-migrate=false

spring.flyway.ignore-missing-migrations=true
spring.flyway.ignore-future-migrations=true
