spring.datasource.url=jdbc:h2:mem:Skillmark-local;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN

app.auth.log-delivery-tokens=true
app.base-url=http://localhost:4200
app.certificate-verify-base-url=http://localhost:4200/verify
cors.allowed-origins=http://localhost:4200
