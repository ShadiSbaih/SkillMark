<div class="flex h-screen w-full overflow-x-hidden bg-[#f6f9fc] text-[#0d253d]">
  <!-- Sidebar -->
  <aside
    class="fixed inset-y-0 left-0 z-40 w-64 transform border-r border-[#a8c3de] bg-white transition-transform duration-200 ease-in-out lg:static lg:translate-x-0"
    [class.-translate-x-full]="!mobileOpen()"
  >
    <div class="flex h-16 items-center border-b border-[#a8c3de] px-6">
      <a class="flex items-center gap-2 font-semibold text-[#533afd]" routerLink="/">
        <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-[#533afd] text-white">S</span>
        <span>Skillmark</span>
      </a>
    </div>

    <nav class="flex flex-col gap-1 p-4" aria-label="Owner navigation">
      <p class="px-3 text-xs font-semibold uppercase tracking-wider text-[#64748d]">Owner</p>
      @for (link of ownerLinks; track link.route) {
        <a
          [routerLink]="link.route"
          routerLinkActive="bg-[#f6f9fc] text-[#533afd]"
          [routerLinkActiveOptions]="{ exact: true }"
          class="rounded-md px-3 py-2 text-sm font-medium text-[#64748d] hover:bg-[#f6f9fc] hover:text-[#0d253d]"
          (click)="closeMobile()"
        >
          {{ link.label }}
        </a>
      }
    </nav>

    <nav class="flex flex-col gap-1 p-4 pt-0" aria-label="Participant navigation">
      <p class="px-3 text-xs font-semibold uppercase tracking-wider text-[#64748d]">Participant</p>
      @for (link of participantLinks; track link.route) {
        <a
          [routerLink]="link.route"
          routerLinkActive="bg-[#f6f9fc] text-[#533afd]"
          class="rounded-md px-3 py-2 text-sm font-medium text-[#64748d] hover:bg-[#f6f9fc] hover:text-[#0d253d]"
          (click)="closeMobile()"
        >
          {{ link.label }}
        </a>
      }
    </nav>
  </aside>

  <!-- Mobile overlay -->
  @if (mobileOpen()) {
    <div class="fixed inset-0 z-30 bg-black/50 lg:hidden" (click)="closeMobile()"></div>
  }

  <!-- Main area -->
  <div class="flex min-w-0 flex-1 flex-col">
    <!-- Top bar -->
    <header class="flex h-16 items-center justify-between border-b border-[#a8c3de] bg-white px-4 lg:px-6">
      <div class="flex items-center gap-3">
        <button
          class="rounded-md p-2 text-[#64748d] hover:bg-[#f6f9fc] lg:hidden"
          (click)="toggleMobile()"
          aria-label="Toggle navigation"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>

        <div class="hidden items-center gap-2 sm:flex">
          <label class="text-sm font-medium text-[#64748d]" for="org-select">Organization</label>
          @if (listQuery.isLoading()) {
            <span class="text-sm text-[#64748d]">Loading…</span>
          } @else if (listQuery.error()) {
            <span class="text-sm text-[#b91c1c]">Failed to load</span>
          } @else {
            <select
              id="org-select"
              class="rounded-md border border-[#a8c3de] bg-[#f6f9fc] px-3 py-1.5 text-sm text-[#0d253d] focus:border-[#533afd] focus:outline-none focus:ring-1 focus:ring-[#533afd]"
              [value]="selectedOrganizationId() ?? ''"
              (change)="onOrganizationChange($event)"
            >
              <option value="" disabled>Select organization</option>
              @for (org of organizations(); track org.id) {
                <option [value]="org.id">{{ org.name }}</option>
              }
            </select>
          }
        </div>
      </div>

      <div class="flex items-center gap-4">
        <a
          class="text-sm font-medium text-[#64748d] hover:text-[#0d253d]"
          routerLink="/verify"
        >
          Verify
        </a>
        <clerk-user-button />
      </div>
    </header>

    <!-- Workspace -->
    <main class="flex-1 overflow-auto p-4 lg:p-8">
      <router-outlet />
    </main>
  </div>
</div>
