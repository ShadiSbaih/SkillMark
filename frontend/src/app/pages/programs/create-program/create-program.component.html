<app-page-header title="Create program" subtitle="Start a new learning program."></app-page-header>

<app-card>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
    <div>
      <label for="title" class="block text-sm font-medium text-ink">Title</label>
      <input
        id="title"
        type="text"
        formControlName="title"
        class="mt-1 block w-full rounded-md border border-input bg-canvas-soft px-3 py-2 text-sm text-ink placeholder-ink-mute focus-ring-primary"
        placeholder="e.g. Q3 Compliance Training"
      />
      @if (form.get('title')?.invalid && form.get('title')?.touched) {
        <p class="mt-1 text-sm text-red-600">
          Title is required and must be 100 characters or less.
        </p>
      }
    </div>

    <div>
      <label for="description" class="block text-sm font-medium text-ink">Description</label>
      <textarea
        id="description"
        formControlName="description"
        rows="4"
        class="mt-1 block w-full rounded-md border border-input bg-canvas-soft px-3 py-2 text-sm text-ink placeholder-ink-mute focus-ring-primary"
        placeholder="What will participants learn?"
      ></textarea>
      @if (form.get('description')?.invalid && form.get('description')?.touched) {
        <p class="mt-1 text-sm text-red-600">Description must be 500 characters or less.</p>
      }
    </div>

    <div>
      <label for="coverImageUrl" class="block text-sm font-medium text-ink">Cover image URL</label>
      <input
        id="coverImageUrl"
        type="url"
        formControlName="coverImageUrl"
        class="mt-1 block w-full rounded-md border border-input bg-canvas-soft px-3 py-2 text-sm text-ink placeholder-ink-mute focus-ring-primary"
        placeholder="https://example.com/image.png"
      />
    </div>

    <div class="grid gap-4 sm:grid-cols-2">
      <div>
        <label for="startDate" class="block text-sm font-medium text-ink">Start date</label>
        <input
          id="startDate"
          type="date"
          formControlName="startDate"
          class="mt-1 block w-full rounded-md border border-input bg-canvas-soft px-3 py-2 text-sm text-ink placeholder-ink-mute focus-ring-primary"
        />
      </div>
      <div>
        <label for="endDate" class="block text-sm font-medium text-ink">End date</label>
        <input
          id="endDate"
          type="date"
          formControlName="endDate"
          class="mt-1 block w-full rounded-md border border-input bg-canvas-soft px-3 py-2 text-sm text-ink placeholder-ink-mute focus-ring-primary"
        />
      </div>
    </div>

    <div class="flex justify-end gap-3">
      <app-button
        type="button"
        variant="ghost"
        (clicked)="router.navigate(['/organizations', organizationId])"
        >Cancel</app-button
      >
      <app-button type="submit" [loading]="mutation.isPending()">Create program</app-button>
    </div>
  </form>
</app-card>
