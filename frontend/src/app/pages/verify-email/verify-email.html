<section class="auth-page">
  <div class="auth-card">
    <h1>Verifying your email</h1>

    @if (isLoading()) {
      <p class="auth-subtitle">Please wait while we confirm your email address...</p>
    } @else if (error()) {
      <p class="auth-subtitle">We couldn't verify your email.</p>
      <div class="auth-error">{{ error() }}</div>
      <div class="auth-links">
        <a routerLink="/sign-in">Back to sign in</a>
      </div>
    } @else {
      <p class="auth-subtitle">Email verified! Redirecting you to the dashboard...</p>
    }
  </div>
</section>
