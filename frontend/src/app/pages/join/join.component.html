<app-page-header title="Join" subtitle="Accept an invitation to join a program or organization" />

<div class="flex items-start justify-center">
  <app-card class="w-full max-w-md">
    @if (error()) {
      <div class="mb-6">
        <h2 class="mb-2 text-lg font-semibold text-ink">Could not join</h2>
        <app-error-state
          [message]="error() ?? 'Failed to join the program.'"
          (retry)="retry()"
        />
      </div>
    }

    @if (code()) {
      @if (joining()) {
        <div class="text-center">
          <app-loading-state
            [message]="'Joining ' + (invitationsService.previewQuery.data()?.programTitle ?? 'program') + '…'"
          />
        </div>
      } @else {
        <div class="text-center">
          <h2 class="mb-2 text-lg font-semibold text-ink">You're invited</h2>
          <p class="mb-6 text-ink-mute">
            Join
            <span class="font-medium text-ink">{{ invitationsService.previewQuery.data()?.programTitle }}</span>
          </p>
          <app-button (clicked)="accept()">Join program</app-button>
        </div>
      }
    } @else {
      <form (ngSubmit)="submitInput()" class="space-y-4">
        <app-form-field
          id="code"
          label="Invitation code"
          hint="Enter the code from your invitation link."
        >
          <input
            id="code"
            type="text"
            [(ngModel)]="inputCode"
            name="code"
            class="form-input"
            placeholder="e.g. SUMMER-2026"
            required
          />
        </app-form-field>

        <app-button
          type="submit"
          [fullWidth]="true"
          [loading]="invitationsService.joinMutation.isPending()"
          [disabled]="!inputCode().trim() || invitationsService.joinMutation.isPending()"
        >
          Join
        </app-button>
      </form>
    }
  </app-card>
</div>
