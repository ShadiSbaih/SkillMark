<app-page-header title="Create organization" subtitle="Set up a new organization for your programs."></app-page-header>

<app-card>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
    <app-form-field
      label="Name"
      id="name"
      [error]="form.get('name')?.invalid && form.get('name')?.touched ? 'Name is required and must be 100 characters or less.' : ''"
    >
      <input
        id="name"
        type="text"
        formControlName="name"
        class="create-organization-input"
        placeholder="e.g. Engineering Onboarding"
        (input)="onNameChange()"
      />
    </app-form-field>

    <app-form-field
      label="Slug"
      id="slug"
      hint="URL-friendly identifier. Auto-generated from the name."
      [error]="form.get('slug')?.invalid && form.get('slug')?.touched ? 'Slug is required and must be lowercase letters, numbers, and hyphens only.' : ''"
    >
      <input
        id="slug"
        type="text"
        formControlName="slug"
        class="create-organization-input"
        placeholder="engineering-onboarding"
      />
    </app-form-field>

    <app-form-field
      label="Description"
      id="description"
      [error]="form.get('description')?.invalid && form.get('description')?.touched ? 'Description must be 500 characters or less.' : ''"
    >
      <textarea
        id="description"
        formControlName="description"
        rows="4"
        class="create-organization-input"
        placeholder="What is this organization for?"
      ></textarea>
    </app-form-field>

    <app-form-field
      label="Logo URL"
      id="logoUrl"
      [error]="form.get('logoUrl')?.invalid && form.get('logoUrl')?.touched ? 'Logo URL must be 500 characters or less.' : ''"
    >
      <input
        id="logoUrl"
        type="url"
        formControlName="logoUrl"
        class="create-organization-input"
        placeholder="https://example.com/logo.png"
      />
    </app-form-field>

    <div class="flex justify-end gap-3">
      <app-button type="button" variant="ghost" (clicked)="router.navigate(['/organizations'])">Cancel</app-button>
      <app-button type="submit" [loading]="mutation.isPending()">Create organization</app-button>
    </div>
  </form>
</app-card>
