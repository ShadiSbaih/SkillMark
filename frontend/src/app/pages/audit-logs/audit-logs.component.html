<section class="page">
  <header class="page-heading">
    <div>
      <p class="breadcrumb">Organizations / CS Club / Audit Logs</p>
      <h1>Audit logs</h1>
      <p>Review organization activity across certificates, quizzes, attempts, programs, and memberships.</p>
    </div>
  </header>

  <div class="panel filter-bar">
    <label>
      <span>Action</span>
      <select><option>All actions</option><option>CERTIFICATE_ISSUED</option><option>QUIZ_PUBLISHED</option></select>
    </label>
    <label>
      <span>Date range</span>
      <input type="date" value="2026-05-18" />
    </label>
  </div>

  <article class="panel">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Entity</th></tr></thead>
        <tbody>
          @for (log of auditLogs; track log.id) {
            <tr>
              <td>{{ log.time }}</td>
              <td>{{ log.actor }}</td>
              <td><span class="status status-submitted">{{ log.action }}</span></td>
              <td>{{ log.entity }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
    <div class="pagination"><button>Prev</button><strong>1</strong><button>2</button><button>Next</button></div>
  </article>
</section>
