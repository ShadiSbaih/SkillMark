<section class="page">
  <header class="page-heading">
    <div>
      <p class="breadcrumb">Organization / Audit logs</p>
      <h1>Audit logs</h1>
      <p>Review organization activity across certificates, quizzes, attempts, programs, and memberships.</p>
    </div>
  </header>

  <div class="mb-6 flex flex-wrap items-end gap-4 rounded-lg border border-light bg-white p-4">
    <label class="block">
      <span class="mb-1 block text-sm font-medium text-ink">Action</span>
      <select class="rounded-md border border-input px-3 py-2 text-sm">
        @for (action of actions; track action) {
          <option [value]="action">{{ action }}</option>
        }
      </select>
    </label>
    <label class="block">
      <span class="mb-1 block text-sm font-medium text-ink">Date range</span>
      <input type="date" value="2026-05-18" class="rounded-md border border-input px-3 py-2 text-sm" />
    </label>
  </div>

  <div class="overflow-hidden rounded-lg border border-light bg-white">
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-canvas-soft">
          <tr>
            <th class="px-4 py-3 text-left font-medium text-ink-mute">Time</th>
            <th class="px-4 py-3 text-left font-medium text-ink-mute">Actor</th>
            <th class="px-4 py-3 text-left font-medium text-ink-mute">Action</th>
            <th class="px-4 py-3 text-left font-medium text-ink-mute">Entity</th>
          </tr>
        </thead>
        <tbody>
          @for (log of auditLogs; track log.id) {
            <tr class="border-t border-light">
              <td class="px-4 py-3 text-ink">{{ log.time }}</td>
              <td class="px-4 py-3 text-ink">{{ log.actor }}</td>
              <td class="px-4 py-3">
                <span class="inline-flex rounded-full bg-gray-light px-2 py-1 text-xs font-medium text-ink">
                  {{ log.action }}
                </span>
              </td>
              <td class="px-4 py-3 text-ink-mute">{{ log.entity }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
    <div class="flex items-center justify-between border-t border-light px-4 py-3">
      <button type="button" class="rounded-md border border-input px-3 py-1-5 text-sm text-ink hover:bg-canvas-soft">Prev</button>
      <div class="flex gap-2 text-sm">
        <span class="rounded-md bg-ink px-3 py-1-5 font-medium text-white">1</span>
        <button type="button" class="rounded-md px-3 py-1-5 text-ink-mute hover:bg-canvas-soft">2</button>
      </div>
      <button type="button" class="rounded-md border border-input px-3 py-1-5 text-sm text-ink hover:bg-canvas-soft">Next</button>
    </div>
  </div>
</section>
