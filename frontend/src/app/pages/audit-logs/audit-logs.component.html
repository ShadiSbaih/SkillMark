<section class="page">
  <header class="page-heading">
    <div>
      <p class="breadcrumb">Organization / Audit logs</p>
      <h1>Audit logs</h1>
      <p>Review organization activity across certificates, quizzes, attempts, programs, and memberships.</p>
    </div>
  </header>

  <div class="mb-6 flex flex-wrap items-end gap-4 rounded-lg border border-[#e1ebf5] bg-white p-4">
    <label class="block">
      <span class="mb-1 block text-sm font-medium text-[#0d253d]">Action</span>
      <select class="rounded-md border border-[#a8c3de] px-3 py-2 text-sm">
        @for (action of actions; track action) {
          <option [value]="action">{{ action }}</option>
        }
      </select>
    </label>
    <label class="block">
      <span class="mb-1 block text-sm font-medium text-[#0d253d]">Date range</span>
      <input type="date" value="2026-05-18" class="rounded-md border border-[#a8c3de] px-3 py-2 text-sm" />
    </label>
  </div>

  <div class="overflow-hidden rounded-lg border border-[#e1ebf5] bg-white">
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-[#f6f9fc]">
          <tr>
            <th class="px-4 py-3 text-left font-medium text-[#64748d]">Time</th>
            <th class="px-4 py-3 text-left font-medium text-[#64748d]">Actor</th>
            <th class="px-4 py-3 text-left font-medium text-[#64748d]">Action</th>
            <th class="px-4 py-3 text-left font-medium text-[#64748d]">Entity</th>
          </tr>
        </thead>
        <tbody>
          @for (log of auditLogs; track log.id) {
            <tr class="border-t border-[#e1ebf5]">
              <td class="px-4 py-3 text-[#0d253d]">{{ log.time }}</td>
              <td class="px-4 py-3 text-[#0d253d]">{{ log.actor }}</td>
              <td class="px-4 py-3">
                <span class="inline-flex rounded-full bg-[#e1ebf5] px-2 py-1 text-xs font-medium text-[#0d253d]">
                  {{ log.action }}
                </span>
              </td>
              <td class="px-4 py-3 text-[#64748d]">{{ log.entity }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
    <div class="flex items-center justify-between border-t border-[#e1ebf5] px-4 py-3">
      <button type="button" class="rounded-md border border-[#a8c3de] px-3 py-1.5 text-sm text-[#0d253d] hover:bg-[#f6f9fc]">Prev</button>
      <div class="flex gap-2 text-sm">
        <span class="rounded-md bg-[#0d253d] px-3 py-1.5 font-medium text-white">1</span>
        <button type="button" class="rounded-md px-3 py-1.5 text-[#64748d] hover:bg-[#f6f9fc]">2</button>
      </div>
      <button type="button" class="rounded-md border border-[#a8c3de] px-3 py-1.5 text-sm text-[#0d253d] hover:bg-[#f6f9fc]">Next</button>
    </div>
  </div>
</section>
