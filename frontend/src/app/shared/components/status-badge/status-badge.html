<span class="inline-flex items-center font-medium"
  [class]="{
    'px-2 py-0.5 text-xs': size() === 'sm',
    'px-2.5 py-0.5 text-sm': size() === 'md',
    'px-3 py-1 text-base': size() === 'lg',
    'rounded-full': true,
    'badge-subtle-green': color() === 'green' && variant() === 'subtle',
    'badge-subtle-amber': color() === 'amber' && variant() === 'subtle',
    'badge-subtle-red': color() === 'red' && variant() === 'subtle',
    'badge-subtle-gray': color() === 'gray' && variant() === 'subtle',
    'badge-solid-green': color() === 'green' && variant() === 'solid',
    'badge-solid-amber': color() === 'amber' && variant() === 'solid',
    'badge-solid-red': color() === 'red' && variant() === 'solid',
    'badge-solid-gray': color() === 'gray' && variant() === 'solid',
    'badge-outline-green': color() === 'green' && variant() === 'outline',
    'badge-outline-amber': color() === 'amber' && variant() === 'outline',
    'badge-outline-red': color() === 'red' && variant() === 'outline',
    'badge-outline-gray': color() === 'gray' && variant() === 'outline'
  }">
  {{ status() }}
</span>
