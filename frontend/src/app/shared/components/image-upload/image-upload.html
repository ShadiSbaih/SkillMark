<div class="space-y-2">
  <label class="block text-sm font-medium text-gray-700">{{ label() }}</label>
  <div class="relative w-full overflow-hidden rounded-lg border border-gray-300 bg-gray-50"
       [class.aspect-square]="aspectRatio() === 'square'"
       [class.aspect-video]="aspectRatio() === 'video'">
    @if (currentPreview()) {
      <img [src]="currentPreview()" alt="Preview" class="h-full w-full object-cover">
      <button type="button" class="absolute right-2 top-2 rounded bg-white px-2 py-1 text-xs shadow" (click)="remove()">Remove</button>
    } @else {
      <label class="flex h-full w-full cursor-pointer items-center justify-center p-6"
             [class.opacity-50]="disabled()" [class.cursor-not-allowed]="disabled()">
        <input type="file" accept="image/*" class="sr-only" [disabled]="disabled()" (change)="onFileSelected($event)">
        <span class="text-sm text-gray-600">Click to upload image</span>
      </label>
    }
  </div>
</div>
