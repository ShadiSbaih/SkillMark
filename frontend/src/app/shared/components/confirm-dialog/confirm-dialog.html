<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
  <div class="w-full max-w-sm rounded-lg bg-white p-6 shadow-xl">
    <h2 class="mb-3 text-lg font-semibold text-gray-900">{{ title() }}</h2>
    <p class="mb-6 text-sm text-gray-600">{{ message() }}</p>
    <div class="flex justify-end gap-3">
      <button
        type="button"
        class="rounded-md px-4 py-2 text-sm font-medium text-gray-700 transition-colors hover:bg-gray-100"
        (click)="onCancel()"
      >
        {{ cancelLabel() }}
      </button>
      <button
        type="button"
        class="rounded-md px-4 py-2 text-sm font-medium text-white transition-colors"
        [class.bg-red-600]="isDanger()"
        [class.hover:bg-red-700]="isDanger()"
        [class.bg-blue-600]="!isDanger()"
        [class.hover:bg-blue-700]="!isDanger()"
        (click)="onConfirm()"
      >
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
</div>
