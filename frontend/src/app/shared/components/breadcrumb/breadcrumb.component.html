<nav aria-label="Breadcrumb" class="sk-breadcrumb-nav mb-4">
  <ol class="sk-breadcrumb-list">
    @for (item of items(); track $index; let last = $last; let first = $first) {
      <li class="sk-breadcrumb-item">
        @if (!last && item.route) {
          <a [routerLink]="item.route" class="sk-breadcrumb-link group">
            @if (first) {
              <svg class="sk-breadcrumb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
              </svg>
            }
            <span>{{ item.label }}</span>
          </a>
        } @else {
          <span class="sk-breadcrumb-current">
            @if (first) {
              <svg class="sk-breadcrumb-icon current" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
              </svg>
            }
            <span>{{ item.label }}</span>
          </span>
        }

        @if (!last) {
          <svg class="sk-breadcrumb-separator" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 18 6-6-6-6"/>
          </svg>
        }
      </li>
    }
  </ol>
</nav>
