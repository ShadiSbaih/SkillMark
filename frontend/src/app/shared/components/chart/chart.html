<div class="w-full" [style.height]="height()">
  @if (data().length === 0) {
    <div class="flex h-full items-center justify-center text-sm text-gray-500">No data</div>
  } @else {
    <svg class="h-full w-full" preserveAspectRatio="none" viewBox="0 0 100 100">
      @for (value of data(); track $index) {
        <rect
          [attr.x]="$index * barWidth() * 2 + barWidth() / 2"
          [attr.y]="100 - (value / maxValue() * 100)"
          [attr.width]="barWidth()"
          [attr.height]="(value / maxValue() * 100)"
          [attr.fill]="colors()[$index % colors().length]"
          rx="1"
        />
      }
    </svg>
  }
</div>
