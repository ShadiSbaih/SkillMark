
# ===============================
# APPLICATION
# ===============================

spring.application.name=Skillmark

# ===============================
# SERVER
# ===============================

server.port=8080


# ===============================
# DATABASE CONFIGURATION
# ===============================

spring.datasource.url=jdbc:postgresql://ep-weathered-star-a9zm0hyu-pooler.gwc.azure.neon.tech/neondb?sslmode=require&channelBinding=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_BeDEoT4t3XHO

spring.datasource.driver-class-name=org.postgresql.Driver


# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# ===============================
# JWT CONFIG
# ===============================

jwt.secret=${JWT_SECRET:change-me-in-production-012345678901234567890123}

jwt.expiration=${JWT_EXPIRATION:86400000}

# ===============================
# OPENAPI / SWAGGER
# ===============================

springdoc.default-consumes-media-type=application/json
springdoc.default-produces-media-type=application/json
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.docExpansion=none
springdoc.swagger-ui.persistAuthorization=true

# ===============================
# LOGGING
# ===============================

logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN


# ===============================
# DEVTOOLS
# ===============================

spring.devtools.restart.enabled=true
