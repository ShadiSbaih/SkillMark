
# ===============================
# APPLICATION
# ===============================

spring.application.name=Skillmark

# ===============================
# SERVER
# ===============================

server.port=8080


# ===============================
# DATABASE CONFIGURATION
# ===============================

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/skillmark}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

spring.datasource.driver-class-name=org.postgresql.Driver


# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# ===============================
# JWT CONFIG
# ===============================

jwt.secret=${JWT_SECRET:change-me-in-production-012345678901234567890123}

jwt.expiration=${JWT_EXPIRATION:86400000}

app.rate-limit.auth.max-requests=${AUTH_RATE_LIMIT_MAX_REQUESTS:30}
app.rate-limit.auth.window-seconds=${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
app.auth.log-delivery-tokens=${AUTH_LOG_DELIVERY_TOKENS:false}

# ===============================
# OPENAPI / SWAGGER
# ===============================

springdoc.default-consumes-media-type=application/json
springdoc.default-produces-media-type=application/json
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.docExpansion=none
springdoc.swagger-ui.persistAuthorization=true

# ===============================
# LOGGING
# ===============================

logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN


# ===============================
# DEVTOOLS
# ===============================

spring.devtools.restart.enabled=true
